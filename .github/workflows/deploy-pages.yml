name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-result.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload static site
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          path = 'deployment-result.json'
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }
          result = {
              'commit': os.environ['GITHUB_SHA'],
              'configure': os.environ.get('CONFIGURE_OUTCOME', ''),
              'upload': os.environ.get('UPLOAD_OUTCOME', ''),
              'deploy': os.environ.get('DEPLOY_OUTCOME', ''),
              'page_url': os.environ.get('PAGE_URL', ''),
          }
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  sha = json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          content = base64.b64encode((json.dumps(result, indent=2) + '\n').encode()).decode()
          payload = {'message': 'Record Pages deployment result', 'content': content, 'branch': 'main'}
          if sha:
              payload['sha'] = sha
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method='PUT')
          with urllib.request.urlopen(request) as response:
              response.read()
          PY

      - name: Report deployment failure
        if: steps.deployment.outcome != 'success'
        run: exit 1
